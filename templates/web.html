<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytdoc</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --card: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e2e5ea;
    --accent: #d93a2f; --accent-ink: #ffffff; --soft: #f0f2f5; --ok: #1a7f4b; --bad: #c0362c; --focus: #3b82f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --ink: #e8eaee; --muted: #9aa3b2; --line: #2c323d;
      --accent: #f0564a; --accent-ink: #ffffff; --soft: #232833; --ok: #4cc38a; --bad: #ff7b70; --focus: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    word-break: keep-all;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 24px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  [hidden] { display: none !important; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--soft); border-radius: 12px; margin-bottom: 20px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 10px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  label.field { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type="url"], select {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, .drop:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
    min-height: 160px; padding: 20px; border: 2px dashed var(--line); border-radius: 12px; cursor: pointer; color: var(--muted);
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: var(--soft); }
  .drop strong { color: var(--ink); }
  .drop .file { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  #lang-wrap { margin-top: 12px; }

  .primary {
    display: block; text-align: center; text-decoration: none; box-sizing: border-box;
    width: 100%; margin-top: 28px; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .primary:disabled { opacity: .5; cursor: default; }
  button.ghost { width: 100%; margin-top: 12px; padding: 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; font: inherit; cursor: pointer; }
  .error { color: var(--bad); margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  .job-title { margin: 0 0 4px; font-size: 18px; overflow-wrap: anywhere; }
  .job-sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 8px 0 20px; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  ol.stages { list-style: none; margin: 0; padding: 0; }
  ol.stages li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  ol.stages li:last-child { border-bottom: 0; }
  .icon { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--muted); }
  li[data-state="running"] .icon { background: transparent; border: 3px solid var(--soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  li[data-state="done"] .icon, li[data-state="cached"] .icon { background: var(--ok); color: #fff; }
  li[data-state="failed"] .icon { background: var(--bad); color: #fff; }
  li[data-state="skipped"] { color: var(--muted); }
  li[data-state="pending"] .name { color: var(--muted); }
  .name small { display: block; color: var(--muted); font-size: 13px; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { li[data-state="running"] .icon { animation: none; border-top-color: var(--soft); background: var(--accent); } }
  .done-box { text-align: center; margin-top: 20px; }
  .done-box p { margin: 0; font-weight: 600; }
  footer { margin-top: 24px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>yt<span>doc</span></h1>
    <p>영상을 받아쓰고, 핵심 장면을 골라, 요약 PDF로 만들어 드려요.</p>
  </header>

  <form id="form" class="card" novalidate>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-youtube" aria-selected="true" aria-controls="panel-youtube">유튜브 주소</button>
      <button type="button" role="tab" id="tab-upload" aria-selected="false" aria-controls="panel-upload">파일 업로드</button>
    </div>

    <div id="panel-youtube" role="tabpanel" aria-labelledby="tab-youtube">
      <label class="field" for="url">YouTube 영상 주소</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <div id="panel-upload" role="tabpanel" aria-labelledby="tab-upload" hidden>
      <span class="field" style="display:block;font-weight:600;margin-bottom:8px">영상 또는 음성 파일</span>
      <label class="drop" id="drop" tabindex="0">
        <input id="file" type="file" accept="video/*,audio/*" hidden>
        <strong id="drop-title">파일을 여기에 끌어다 놓거나 눌러서 고르세요</strong>
        <span class="file" id="drop-file"></span>
        <span id="drop-hint">mp4, mov, mkv, webm, mp3, m4a, wav 등</span>
      </label>
    </div>

    <div class="row">
      <div>
        <label class="field" for="translate" style="margin:0">번역하기</label>
        <p class="hint" id="translate-hint">끄면 영상에서 말하는 언어 그대로 문서를 만들어요.</p>
      </div>
      <span class="switch"><input id="translate" type="checkbox" role="switch" aria-describedby="translate-hint"><span></span></span>
    </div>
    <div id="lang-wrap" hidden>
      <label class="field" for="lang">번역할 언어</label>
      <select id="lang">
        <!--LANGUAGE_OPTIONS-->
      </select>
      <p class="hint">요약, 챕터, 전체 받아쓰기가 모두 이 언어로 나와요.</p>
    </div>

    <button class="primary" id="submit" type="submit">PDF 만들기</button>
    <div class="bar" id="upload-bar" hidden><div></div></div>
    <p class="error" id="form-error" role="alert" hidden></p>
  </form>

  <section id="progress" class="card" hidden aria-live="polite">
    <h2 class="job-title" id="job-title"></h2>
    <p class="job-sub" id="job-sub"></p>
    <ol class="stages" id="stages"></ol>
    <p class="error" id="job-error" role="alert" hidden></p>
    <div class="done-box" id="done" hidden>
      <p>PDF가 준비됐어요.</p>
      <a class="primary" id="download" href="#" download>PDF 내려받기</a>
    </div>
    <button class="ghost" id="again" type="button" hidden>다른 영상 만들기</button>
  </section>

  <footer>이 화면은 내 컴퓨터에서만 열려요. 처음 실행하는 영상은 몇 분 걸릴 수 있어요.</footer>
</main>

<script>
// Filled in by the server from `ytdoc serve --max-upload-mb`.
const MAX_UPLOAD_BYTES = Number("__MAX_UPLOAD_BYTES__");
const DOING = {
  download: "영상을 가져오는 중",
  audio: "영상에서 소리를 꺼내는 중",
  transcribe: "말소리를 글자로 바꾸는 중 (가장 오래 걸려요)",
  frames: "핵심 장면을 고르는 중",
  proofread: "받아쓰기의 잘못 들은 말을 고치는 중",
  translate: "받아쓰기를 번역하는 중",
  summarize: "Claude가 요약하는 중",
  pdf: "문서를 만드는 중",
};
const $ = (id) => document.getElementById(id);
let mode = "youtube";
let file = null;
let timer = null;

function setMode(next) {
  mode = next;
  for (const m of ["youtube", "upload"]) {
    $("tab-" + m).setAttribute("aria-selected", String(m === next));
    $("panel-" + m).hidden = m !== next;
  }
  hideError();
}
$("tab-youtube").onclick = () => setMode("youtube");
$("tab-upload").onclick = () => setMode("upload");

function pick(f) {
  if (!f) return;
  file = f;
  $("drop-title").textContent = "고른 파일";
  $("drop-file").textContent = `${f.name} (${(f.size / 1048576).toFixed(1)}MB)`;
  $("drop-hint").textContent = "다른 파일로 바꾸려면 다시 누르거나 끌어다 놓으세요";
  hideError();
}
$("file").onchange = (e) => pick(e.target.files[0]);
$("drop").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
for (const type of ["dragenter", "dragover"]) $("drop").addEventListener(type, (e) => { e.preventDefault(); $("drop").classList.add("over"); });
for (const type of ["dragleave", "drop"]) $("drop").addEventListener(type, (e) => { e.preventDefault(); $("drop").classList.remove("over"); });
$("drop").addEventListener("drop", (e) => pick(e.dataTransfer.files[0]));

$("translate").onchange = () => { $("lang-wrap").hidden = !$("translate").checked; };

function showError(el, message) { el.textContent = message; el.hidden = false; }
function hideError() { $("form-error").hidden = true; }

async function errorOf(res) {
  try { const body = await res.json(); return body.error || "입력값을 확인해 주세요."; }
  catch { return `서버 오류 (${res.status})`; }
}

function submit(form) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/jobs");
    const bar = $("upload-bar");
    if (form.has("file")) {
      bar.hidden = false;
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) bar.firstElementChild.style.width = (100 * e.loaded / e.total) + "%"; };
    }
    xhr.onload = () => {
      bar.hidden = true;
      let body = {};
      try { body = JSON.parse(xhr.responseText); } catch {}
      xhr.status === 200 ? resolve(body.id) : reject(new Error(body.error || `시작하지 못했어요 (${xhr.status})`));
    };
    xhr.onerror = () => { bar.hidden = true; reject(new Error("서버에 닿지 못했어요. 서버가 켜져 있는지 확인해 주세요.")); };
    xhr.send(form);
  });
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  hideError();
  const form = new FormData();
  if (mode === "youtube") {
    const url = $("url").value.trim();
    if (!/^https?:\/\/\S+$/.test(url)) return showError($("form-error"), "YouTube 영상 주소를 넣어 주세요. 예: https://www.youtube.com/watch?v=...");
    form.append("url", url);
  } else if (!file) {
    return showError($("form-error"), "올릴 파일을 골라 주세요.");
  } else if (MAX_UPLOAD_BYTES > 0 && file.size > MAX_UPLOAD_BYTES) {
    const mb = Math.floor(MAX_UPLOAD_BYTES / (1024 * 1024));
    return showError($("form-error"), `파일이 너무 커요. 최대 ${mb} MB까지 올릴 수 있어요 (ytdoc serve --max-upload-mb로 바꿀 수 있어요).`);
  }
  if ($("translate").checked) form.append("translate", $("lang").value);
  if (mode === "upload") form.append("file", file);
  const button = $("submit");
  button.disabled = true;
  button.textContent = mode === "upload" ? "파일 올리는 중..." : "시작하는 중...";
  try {
    const id = await submit(form);
    location.hash = "job=" + id;
    watch(id);
  } catch (err) {
    showError($("form-error"), err.message);
  } finally {
    button.disabled = false;
    button.textContent = "PDF 만들기";
  }
};

function clock(s) { s = Math.floor(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function render(job) {
  $("job-title").textContent = job.title || job.label;
  const lang = job.translate ? `${job.translate}로 번역` : "원래 언어 그대로";
  const status = { queued: job.ahead ? `앞에 ${job.ahead}개 작업이 기다리는 중` : "곧 시작해요",
                   running: "만드는 중", done: `완료 (${clock(job.elapsed)})`, failed: "실패" }[job.state];
  $("job-sub").textContent = `${lang} · ${status}`;
  $("stages").replaceChildren(...job.stages.map((s) => {
    const li = document.createElement("li");
    li.dataset.state = s.status;
    li.dataset.stage = s.key;
    const icon = { done: "✓", cached: "✓", failed: "!", skipped: "–" }[s.status] || "";
    const note = { running: s.detail || DOING[s.key], cached: "이전 결과 다시 사용", skipped: "필요 없어서 건너뜀", failed: "여기서 멈췄어요" }[s.status] || "";
    const time = ["running", "done", "cached", "failed"].includes(s.status) && s.elapsed != null ? clock(s.elapsed) : "";
    li.innerHTML = `<span class="icon" aria-hidden="true">${icon}</span><span class="name"></span><span class="time">${time}</span>`;
    li.querySelector(".name").textContent = s.label;
    if (note) { const small = document.createElement("small"); small.textContent = note; li.querySelector(".name").append(small); }
    return li;
  }));
  $("done").hidden = job.state !== "done";
  if (job.state === "done") $("download").href = `/api/jobs/${job.id}/pdf`;
  $("job-error").hidden = job.state !== "failed";
  if (job.state === "failed") $("job-error").textContent = "만들지 못했어요.\n" + job.error;
  $("again").hidden = !["done", "failed"].includes(job.state);
}

function watch(id) {
  $("form").hidden = true;
  $("progress").hidden = false;
  clearTimeout(timer);
  const poll = async () => {
    try {
      const res = await fetch(`/api/jobs/${id}`);
      if (!res.ok) { render({ id, label: "", title: "", state: "failed", stages: [], error: await errorOf(res) }); return; }
      const job = await res.json();
      render(job);
      if (job.state === "queued" || job.state === "running") timer = setTimeout(poll, 1000);
    } catch {
      timer = setTimeout(poll, 2000);
    }
  };
  poll();
}

$("again").onclick = () => {
  clearTimeout(timer);
  history.replaceState(null, "", location.pathname);
  $("progress").hidden = true;
  $("form").hidden = false;
};

const resume = location.hash.match(/job=(\d+)/);
if (resume) watch(resume[1]);
</script>
</body>
</html>
