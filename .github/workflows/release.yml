name: Release

# Pushing a version tag (for example `git tag v0.2.0 && git push origin v0.2.0`)
# builds ytdoc for Linux, macOS and Windows and attaches the archives to a
# GitHub release for that tag. A pull request that changes this file only runs
# the build job, to check the workflow; it never publishes anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Apple Silicon; the build turns on Metal for whisper.cpp (see Cargo.toml).
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      # Same as CI: do not tune whisper.cpp for the build machine's CPU,
      # so the binary runs on other computers too.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # CMake, a C/C++ compiler and LLVM/clang (for whisper.cpp and its bindings)
      # come with the GitHub runner images, as in ci.yml.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name="ytdoc-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=ytdoc
          if [ "${{ runner.os }}" = "Windows" ]; then exe=ytdoc.exe; fi
          cp "target/${{ matrix.target }}/release/$exe" README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ytdoc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ytdoc-* > SHA256SUMS.txt
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
