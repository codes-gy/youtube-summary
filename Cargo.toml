[package]
name = "ytdoc"
version = "0.1.0"
edition = "2024"
description = "YouTube 영상이나 영상 파일을 받아쓰기, 핵심 장면, 요약이 담긴 PDF로 만듭니다"
license = "MIT"
repository = "https://github.com/codes-gy/youtube-summary"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
minijinja = { version = "3.1.0", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "signal"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
